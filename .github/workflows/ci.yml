name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  linux-cpu-offline:
    name: Linux CPU offline
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_TYPE: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run offline repository tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Configure native CPU offline build
        run: >-
          cmake -S . -B build
          -DCPDIF_BUILD_TESTS=ON
          -DCPDIF_ENABLE_CUDA=OFF
          -DCPDIF_OFFLINE=ON
          -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}"

      - name: Build native CPU offline targets
        run: cmake --build build --parallel 2

      - name: Run native offline tests
        run: ctest --test-dir build --output-on-failure
